#
# Release: build the universal macOS DMG on a version tag and attach it to a GitHub Release.
#
# Works WITHOUT any secret: the build is then ad-hoc signed, not notarised, named
# Castellum-<version>-unsigned.dmg, and the release notes say so (Gatekeeper steps in README).
#
# Developer ID signing and notarisation switch on only when these repository secrets exist:
#   APPLE_TEAM_ID                  10-character Apple Team ID
#   DEVELOPER_ID_CERT_P12_BASE64   base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_CERT_PASSWORD     the .p12 passphrase
#   APPLE_API_KEY_BASE64           base64 of an App Store Connect API key (AuthKey_XXXX.p8), for notarytool
#   APPLE_API_KEY_ID               that key's Key ID
#   APPLE_API_ISSUER               the App Store Connect issuer UUID
# Signing needs the first three; notarisation needs all six. Only a notarised build also
# gets the stable asset name Castellum.dmg (so a website link never serves an unsigned file).
#
# Local reproduction: scripts/release-build.sh --version X.Y.Z (same script, same rules).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (e.g. 0.4.0). Builds an artifact only; no release.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build DMG and publish the release
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HAS_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' && secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.DEVELOPER_ID_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '$v'"; exit 1; }
          pre=false; [[ "$v" == *-* ]] && pre=true
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $v (prerelease: $pre), signing: $HAS_SIGNING, notarisation: $HAS_NOTARY"

      # XcodeGen emits the Xcode 16+ project format; pick the newest stable Xcode on the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Import the Developer ID certificate (only with secrets)
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          kc="$RUNNER_TEMP/release.keychain-db"
          kc_pw="$(uuidgen)"
          p12="$RUNNER_TEMP/devid.p12"
          printf '%s' "$P12_BASE64" | base64 -d > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          # Without this, codesign waits for a UI prompt that never appears on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          security find-identity -v -p codesigning | grep -c "Developer ID Application"

      - name: Write the notary API key (only with secrets)
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPLE_TEAM_ID: ${{ env.HAS_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/release-build.sh --version "${{ steps.v.outputs.version }}" --out dist

      - name: Upload the build as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: castellum-${{ steps.v.outputs.version }}
          path: |
            dist/*.dmg
            dist/*-SHA256SUMS.txt
            dist/build-info.txt
          if-no-files-found: error

      - name: Publish the GitHub Release (tags only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          t=$'\x60'   # a Markdown backtick
          head="Castellum $VERSION for macOS 13 or later (Apple silicon and Intel)."
          if grep -q '^notarised=1' dist/build-info.txt; then
            body="Signed with Developer ID and notarised by Apple. Download ${t}Castellum-$VERSION.dmg${t}, open it and drag Castellum to Applications."
          else
            body="**Unsigned build.** ${t}Castellum-$VERSION-unsigned.dmg${t} is ad-hoc signed and NOT notarised by Apple, so macOS blocks it the first time. To open it: drag Castellum to Applications, then in Terminal run ${t}xattr -dr com.apple.quarantine /Applications/Castellum.app${t}, or try to open it once and then use System Settings > Privacy & Security > \"Open Anyway\". Details: README, section \"Opening an unsigned build\"."
          fi
          printf '%s\n\n%s\n\nSHA-256:\n%s%s%s\n%s\n%s%s%s\n' "$head" "$body" "$t" "$t" "$t" \
            "$(cat dist/*-SHA256SUMS.txt)" "$t" "$t" "$t" > "$notes"
          pre=(); [ "$PRERELEASE" = "true" ] && pre=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run of the same tag: replace the assets, keep the release.
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*-SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" ${pre[@]+"${pre[@]}"} --verify-tag \
              --title "Castellum $VERSION" --notes-file "$notes" \
              dist/*.dmg dist/*-SHA256SUMS.txt
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12"
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true; fi
